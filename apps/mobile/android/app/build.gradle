apply plugin: 'com.android.application'

// The app's version is the one in the package.json at the top of the repository (npm version bumps it), so the app knows which
// version it is when it looks for a newer one. Android wants a whole number that grows: 0.9.2 -> 902.
def cnVersion = new groovy.json.JsonSlurper().parse(file('../../../../package.json')).version.toString()
def cnParts = cnVersion.split('[.-]').take(3).collect { it.isInteger() ? it.toInteger() : 0 }
while (cnParts.size() < 3) { cnParts << 0 }
def cnCode = Math.max(1, cnParts[0] * 10000 + cnParts[1] * 100 + cnParts[2])

// Signing: the same key on every machine, so an APK built anywhere installs over (updates) one built anywhere else.
// The key comes from environment variables or from a git-ignored android/keystore.properties; with neither, Gradle falls
// back to this machine's own debug key (such an APK cannot update one signed by another machine's key).
//   CAVE_KEYSTORE_FILE, CAVE_KEYSTORE_PASSWORD, CAVE_KEY_ALIAS, CAVE_KEY_PASSWORD
//   (keystore.properties: storeFile=, storePassword=, keyAlias=, keyPassword=; see docs/the-app/android.md)
def cnKeyProps = new Properties()
def cnKeyFile = rootProject.file('keystore.properties')
if (cnKeyFile.exists()) cnKeyFile.withInputStream { cnKeyProps.load(it) }
def cnKey = { String env, String prop -> System.getenv(env) ?: cnKeyProps.getProperty(prop) }
def cnStore = cnKey('CAVE_KEYSTORE_FILE', 'storeFile')

android {
    namespace = "com.lynnmichaelmartin.cavenotes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lynnmichaelmartin.cavenotes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode cnCode
        versionName cnVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        cave {
            if (cnStore) {
                storeFile rootProject.file(cnStore).exists() ? rootProject.file(cnStore) : file(cnStore)
                storePassword cnKey('CAVE_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias cnKey('CAVE_KEY_ALIAS', 'keyAlias')
                keyPassword cnKey('CAVE_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            if (cnStore) signingConfig signingConfigs.cave
        }
        release {
            if (cnStore) signingConfig signingConfigs.cave
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
