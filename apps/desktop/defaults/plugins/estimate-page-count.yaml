# Shipped with Cave Notes. Edit it freely: your changes are kept when the app updates.
# To remove it, delete this file or use Plugins > All plugins.
rules:
  - id: estimate-page-count
    on: { plugin: "Estimate page count" }
    ask:
      result:
        type: info
        label: "${words} words is about ${round(words / 250, 1)} pages at 250 words per page${selection ? ' (selected text)' : ''}."
    do:
      - log: "page count shown"
